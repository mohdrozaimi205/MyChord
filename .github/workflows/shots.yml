name: Gambar skrin

on:
  push:
    branches: [ shots ]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bina APK
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ambil gambar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/shots.sh
      - name: Simpan gambar ke cabang screenshots-out
        run: |
          git config user.name "mychord-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan screenshots-out
          git rm -rfq --cached . >/dev/null
          git add -f out/*.png
          git commit -qm "Gambar skrin"
          git push -f origin screenshots-out
