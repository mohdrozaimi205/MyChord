name: Bina APK MyChord

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bina APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Namakan APK
        run: cp app/build/outputs/apk/release/app-release.apk MyChord-v1.0.${{ github.run_number }}.apk

      - name: Muat naik ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MyChord v1.0.${{ github.run_number }}
          body: APK MyChord dibina automatik. Muat turun fail .apk di bawah dan pasang di telefon.
          files: MyChord-v1.0.${{ github.run_number }}.apk
