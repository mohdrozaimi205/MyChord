name: Uji di emulator

on:
  push:
    branches: [ crashtest ]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bina APK
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Jalankan app dalam emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -n com.mychord.app/.MainActivity
            sleep 25
            adb shell am start -n com.mychord.app/.PlayerActivity || true
            sleep 5
            adb logcat -d > logcat.txt || true
            echo "=====CRASH====="
            grep -A40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -150 || true
            echo "=====MYCHORD====="
            grep -iE "mychord|newpipe" logcat.txt | grep -iE "exception|error|caused" | head -60 || true
            adb shell pidof com.mychord.app && echo "APP_HIDUP" || echo "APP_MATI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
