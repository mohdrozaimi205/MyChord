plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.mychord.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mychord.app"
        minSdk 26
        targetSdk 35
        versionCode runNo
        versionName "1.0." + runNo
        resourceConfigurations += ['ms', 'en']
    }

    signingConfigs {
        mychord {
            storeFile file('mychord-release.jks')
            storePassword 'mychord123'
            keyAlias 'mychord'
            keyPassword 'mychord123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mychord
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.mychord
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.27.1'
}
